<style>
:root{ --bg:#f6f5f2; --card:#fff; --ink:#1b1a17; --mut:#6b6862; --line:#dedbd4;
  --ea:#1f6feb; --ed:#c2410c; --bad:#b91c1c; --ok:#15803d; }
@media (prefers-color-scheme: dark){
  :root{ --bg:#16151a; --card:#201f26; --ink:#eceaf2; --mut:#9d99a8; --line:#332f3c;
         --ea:#6aa4ff; --ed:#f97316; --bad:#f87171; --ok:#4ade80; } }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);
  padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:140px}
.bar>i{display:block;height:100%;background:var(--ink);width:0;transition:width .2s}
.small{font-size:13px;color:var(--mut)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);
  color:var(--ink);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--ink)}
main{max-width:860px;margin:0 auto;padding:22px 20px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:12px}
.handle{font-weight:600}
.tag{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:20px;padding:1px 9px}
.txt{font-size:20px;line-height:1.45;white-space:pre-wrap;word-break:break-word;margin:6px 0 14px}
.host{font-size:13px;color:var(--mut);margin-bottom:4px}
.host b{color:var(--ink);font-weight:600}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
@media(max-width:700px){.duo{grid-template-columns:1fr}}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.box h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.box.auto{border-left:3px solid var(--mut)}
.box p{margin:8px 0 0;font-size:14px;color:var(--mut)}
.pill{font:600 13px ui-monospace,Menlo,Consolas,monospace;border-radius:5px;padding:2px 7px;border:1px solid var(--line)}
.pill.EA{color:var(--ea);border-color:var(--ea)} .pill.ED{color:var(--ed);border-color:var(--ed)}
fieldset{border:0;padding:0;margin:14px 0 0}
legend{font-size:13px;color:var(--mut);margin-bottom:7px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1px solid var(--line);border-radius:9px;padding:8px 14px;background:var(--card);color:var(--ink)}
.opt kbd{font:600 11px ui-monospace,Menlo,Consolas,monospace;color:var(--mut);
  border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:7px}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.sel[data-v=EA]{border-color:var(--ea);box-shadow:inset 0 0 0 1px var(--ea);color:var(--ea)}
.opt.sel[data-v=ED]{border-color:var(--ed);box-shadow:inset 0 0 0 1px var(--ed);color:var(--ed)}
textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);color:var(--ink);min-height:78px;resize:vertical}
.nav{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
.nav .go{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.flag{font-size:13px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);color:var(--mut)}
.flag.mud{color:var(--bad);border-color:var(--bad)}
.flag.man{color:var(--ok);border-color:var(--ok)}
table.fim{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
table.fim th,table.fim td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.fim th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
</style>
</head>

</header>

const CHAVE = 'stance_rev_' + 'dc8ee39ff69b';
let R = JSON.parse(localStorage.getItem(CHAVE) || '{}');
let i = 0;
const salva = () => localStorage.setItem(CHAVE, JSON.stringify(R));
const esc = s => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function estado(t) {
  if (!R[t.id_tweet]) R[t.id_tweet] = {cidadao: t.cidadao_v1, stance: t.stance_v1,
                                       confianca: t.confianca_v1, justificativa: '', visto: false};
  return R[t.id_tweet];
}
const mudou = t => { const r = estado(t);
  return r.cidadao !== t.cidadao_v1 || r.stance !== t.stance_v1 || r.confianca !== t.confianca_v1; };
const vistos = () => ITENS.filter(t => R[t.id_tweet] && R[t.id_tweet].visto).length;

function pinta() {
  document.getElementById('prog').style.width = (100 * vistos() / ITENS.length) + '%';
  document.getElementById('pos').textContent = (i + 1) + ' de ' + ITENS.length + ' · ' + vistos() + ' revistos';
}

function tela() {
  if (i >= ITENS.length) return fim();
  const t = ITENS[i], r = estado(t);
  const bt = (g, v, k, lb) => '<button class="opt' + (r[g] === v ? ' sel' : '') + '" data-g="' + g +
      '" data-v="' + v + '"><kbd>' + k + '</kbd>' + lb + '</button>';
  const tags = [];
  if (t.eh_retweet === '1') tags.push('<span class="tag">retweet</span>');
  if (t.verificado === '1') tags.push('<span class="tag">verificado</span>');
  tags.push('<span class="tag">' + Number(t.seguidores).toLocaleString('pt-BR') + ' seguidores</span>');
  tags.push('<span class="tag">' + Number(t.tweets_do_autor).toLocaleString('pt-BR') + ' tweets</span>');
  document.getElementById('pane').innerHTML =
  '<div class="card">' +
    '<div class="meta"><span class="handle">' + esc(t.autor) + '</span>' +
      '<span class="small">' + esc(t.nome_autor) + '</span>' +
      '<span class="small">· item ' + t.ordem_dev + ' do dev · ' + esc(t.tipo) + '</span> ' + tags.join(' ') + '</div>' +
    '<div class="txt">' + esc(t.texto) + '</div>' +
    (t.host1 ? '<div class="host">link resolve em <b>' + esc(t.host1) + '</b></div>' : '') +
    '<div class="duo">' +
      '<div class="box"><h4>o que você marcou</h4>' +
        '<span class="pill ' + t.stance_v1 + '">' + t.stance_v1 + '</span> ' +
        '<span class="small">cidadão ' + t.cidadao_v1 + ' · confiança ' + t.confianca_v1 +
        (t.notas_v1 ? ' · ' + esc(t.notas_v1) : '') + '</span></div>' +
      '<div class="box auto"><h4>o automático marcou</h4>' +
        '<span class="pill ' + t.stance_auto + '">' + t.stance_auto + '</span> ' +
        '<span class="small">cidadão ' + t.cidadao_auto + ' · confiança ' + t.confianca_auto + '</span>' +
        '<p>' + esc(t.porque) + '</p></div>' +
    '</div>' +
    '<fieldset><legend>cidadão comum?</legend><div class="opts">' +
      bt('cidadao','S','q','Sim') + bt('cidadao','N','w','Não') + bt('cidadao','?','e','Não dá') + '</div></fieldset>' +
    '<fieldset><legend>stance</legend><div class="opts">' +
      bt('stance','EA','a','EA') + bt('stance','ED','s','ED') + bt('stance','NDA','d','NDA') + '</div></fieldset>' +
    '<fieldset><legend>confiança</legend><div class="opts">' +
      bt('confianca','3','3','3') + bt('confianca','2','2','2') + bt('confianca','1','1','1') + '</div></fieldset>' +
    '<fieldset><legend>por que você foi por esse caminho? <span class="small">(entra no diário de decisões)</span></legend>' +
      '<textarea id="jt" placeholder="ex.: li o RT como circulação de notícia, não como endosso — para mim endosso exige comentário">' +
      esc(r.justificativa) + '</textarea></fieldset>' +
    '<div class="nav"><button id="ant">← anterior</button>' +
      '<button class="go" id="prox">próximo →</button>' +
      '<span class="flag ' + (mudou(t) ? 'mud' : 'man') + '">' + (mudou(t) ? 'mudou' : 'mantido') + '</span>' +
      '<span class="small">q/w/e · a/s/d · 1/2/3 · Enter avança</span></div>' +
  '</div>';
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => marca(b.dataset.g, b.dataset.v));

  document.getElementById('ant').onclick = () => { if (i > 0) { i--; tela(); } };
  document.getElementById('prox').onclick = avanca;
  pinta();
}

function marca(g, v) { const t = ITENS[i]; estado(t)[g] = v; salva(); tela(); }
function avanca() { estado(ITENS[i]).visto = true; salva(); i++; tela(); }

function fim() {
  const mud = ITENS.filter(mudou);
  const linhas = mud.map(t => { const r = R[t.id_tweet];
    return '<tr><td class="small">' + t.ordem_dev + '</td><td class="small">' + esc(t.texto).slice(0, 90) + '…</td>' +
      '<td><span class="pill ' + t.stance_v1 + '">' + t.stance_v1 + '</span> ' + t.cidadao_v1 + '</td>' +
      '<td><span class="pill ' + r.stance + '">' + r.stance + '</span> ' + r.cidadao + '</td></tr>'; }).join('');
  document.getElementById('pane').innerHTML =
  '<div class="card"><h2 style="margin:0 0 6px">Revisão fechada</h2>' +
    '<p class="small">Você reviu ' + ITENS.length + ' divergências e mudou <b>' + mud.length + '</b>. ' +
      'Exporte o CSV e me mande — as justificativas viram seção do diário de decisões, e as três lacunas de regra ' +
      'do codebook se resolvem com elas.</p>' +
    (mud.length ? '<table class="fim"><tr><th>#</th><th>tweet</th><th>antes</th><th>depois</th></tr>' + linhas + '</table>' : '') +
    '<div class="nav"><button class="go" id="ex2">Exportar CSV</button>' +
      '<button id="rev0">rever do início</button></div></div>';
  document.getElementById('ex2').onclick = exporta;
  document.getElementById('rev0').onclick = () => { i = 0; tela(); };
  pinta();
}

function exporta() {
  const cab = ["ordem_dev","id_tweet","autor","texto","tipo","cidadao_v1","stance_v1","confianca_v1",
    "cidadao_auto","stance_auto","cidadao_v2","stance_v2","confianca_v2","mudou","justificativa"];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const linhas = [cab.map(q).join(',')];
  for (const t of ITENS) { const r = estado(t);
    const v = {ordem_dev: t.ordem_dev, id_tweet: t.id_tweet, autor: t.autor, texto: t.texto, tipo: t.tipo,
      cidadao_v1: t.cidadao_v1, stance_v1: t.stance_v1, confianca_v1: t.confianca_v1,
      cidadao_auto: t.cidadao_auto, stance_auto: t.stance_auto,
      cidadao_v2: r.cidadao, stance_v2: r.stance, confianca_v2: r.confianca,
      mudou: mudou(t) ? '1' : '0', justificativa: r.justificativa};
    linhas.push(cab.map(c => q(v[c])).join(',')); }
  const blob = new Blob(['﻿' + linhas.join('\r\n')], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'revisao_dev_MARIANA.csv'; a.click();
}
document.getElementById('exp').onclick = exporta;

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') { if (e.key === 'Escape') e.target.blur(); return; }
  if (i >= ITENS.length) return;
  const m = {q:['cidadao','S'], w:['cidadao','N'], e:['cidadao','?'],
             a:['stance','EA'], s:['stance','ED'], d:['stance','NDA'],
             '1':['confianca','1'], '2':['confianca','2'], '3':['confianca','3']}[e.key.toLowerCase()];
  if (m) { e.preventDefault(); marca(m[0], m[1]); return; }
  if (e.key === 'Enter') { e.preventDefault(); avanca(); }
  if (e.key === 'ArrowLeft' && i > 0) { i--; tela(); }
});
tela();
</script>
